# analysis_options.yaml
# Minimal, compatible config for FlutLab / DreamFlow

analyzer:
  exclude:
    - build/**
    # IMPORTANT: patterns that start with "*" must be quoted in YAML.
    # Otherwise YAML treats them as an alias (and you'll see: "Undefined alias").
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    avoid_print: false
